<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff5fa">
<title>Browse X</title>
<style>
:root{color-scheme:light;--canvas:#eff5fa;--pearl:#f7f9fc;--ink:#132b40;--muted:#53697b;--blue:#0866d9;--line:#d7e3ec;--white:#fff;--shadow:0 6px 24px rgba(38,77,108,.07);--card-radius:22px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:linear-gradient(112deg,#e0f6fc 0%,#f4f7fc 48%,#e6ecfc 100%);background-attachment:fixed}
main{width:min(100%,560px);margin:auto;padding:24px 20px 34px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#5fc8e9,#3b69c9 58%,#766bd1);display:grid;place-items:center;color:white;font-size:26px;font-weight:300;box-shadow:0 5px 14px #477cc333}
.brand-name{font-size:23px;font-weight:750;letter-spacing:-.7px}
.icon-btn{width:44px;height:44px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-size:21px;box-shadow:var(--shadow)}
.greeting{margin:0 0 25px}
h1{font-size:32px;line-height:1.12;letter-spacing:-1.1px;margin:0 0 10px;font-weight:750}
.greeting p{font-size:14px;color:var(--muted);margin:0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.section-head h2{font-size:17px;font-weight:450;margin:0}
.text-action{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:650;padding:6px 0}
.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:27px}
.shortcut{display:flex;min-width:0;align-items:center;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.shortcut-icon{width:56px;height:56px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:25px;font-weight:500;box-shadow:var(--shadow);color:var(--blue)}
.shortcut:nth-child(2) .shortcut-icon{color:#132b40}
.shortcut:nth-child(3) .shortcut-icon{color:#132b40}
.shortcut:nth-child(4) .shortcut-icon{color:#132b40}
.shortcut span:last-child{font-size:11px;font-weight:550;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.reading-head{margin-bottom:14px}
.reading-card{padding:12px;border-radius:22px;background:#fff;border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block}
.editorial-art{height:138px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(130deg,#b7cbd2 0%,#d7d6c7 45%,#8da8a9 100%)}
.editorial-art:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e8cf,#b5a58f 65%,#7c8e8c);left:8%;top:-62px;box-shadow:100px 48px 0 -28px rgba(255,255,255,.35)}
.editorial-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,40,51,.08),transparent 60%),linear-gradient(0deg,rgba(14,35,45,.18),transparent 55%)}
.article-info{padding:10px 0 0}
.kicker{font-size:11px;color:var(--blue);letter-spacing:.2px;margin-bottom:5px}
.article-title{font-size:20px;line-height:1.2;margin:0 0 6px;font-weight:500}
.article-meta{font-size:12px;color:var(--muted)}
.search-hint{margin:22px 0 0;text-align:center;font-size:11px;color:#71869a}
body.dark{--canvas:#111d2e;--ink:#edf5ff;--muted:#aab9c9;--line:#31445a;--white:#1c2b40;background:linear-gradient(120deg,#1c3547,#1c263e 52%,#302c4a);color:var(--ink)}
body.dark .icon-btn,body.dark .shortcut-icon,body.dark .reading-card{background:#20334a;color:var(--ink)}
body.dark .mark{box-shadow:none}
body.dark .editorial-art{filter:brightness(.8)}
@media(max-width:360px){main{padding:18px 14px}.shortcuts{gap:5px}.shortcut-icon{width:50px;height:50px}.shortcut span:last-child{font-size:10px}h1{font-size:29px}}
@media(min-width:700px){main{padding-top:38px}.shortcuts{gap:16px}.shortcut-icon{width:62px;height:62px}}
</style>
</head>
<body>
<main>
<header>
 <div class="brand"><div class="mark" aria-hidden="true">✳</div><div class="brand-name">Browse X</div></div>
 <button class="icon-btn" id="settings" aria-label="Settings">☷</button>
</header>
<section class="greeting"><h1>A little curiosity.<br>A wider world.</h1><p id="greeting">Good morning. Where to next?</p></section>
<section aria-labelledby="everyday-title">
 <div class="section-head"><h2 id="everyday-title">Your everyday</h2><button class="text-action" id="edit">Edit</button></div>
 <nav class="shortcuts" id="shortcuts" aria-label="Favorite websites">
  <a class="shortcut" href="https://fieldnotes.design"><span class="shortcut-icon">F</span><span>Fieldnotes</span></a>
  <a class="shortcut" href="https://www.are.na"><span class="shortcut-icon">A</span><span>Are.na</span></a>
  <a class="shortcut" href="https://www.wikipedia.org"><span class="shortcut-icon">W</span><span>Wikipedia</span></a>
  <a class="shortcut" href="https://linear.app"><span class="shortcut-icon">L</span><span>Linear</span></a>
 </nav>
</section>
<section aria-labelledby="reading-title">
 <div class="section-head reading-head"><h2 id="reading-title">Pick up a good read</h2><button class="text-action" id="view-all">View all</button></div>
 <a class="reading-card" href="https://fieldnotes.design">
  <div class="editorial-art" role="img" aria-label="Soft editorial still life"></div>
  <div class="article-info"><div class="kicker">FIELDNOTES&nbsp; / &nbsp;DESIGN &amp; LIVING</div><h3 class="article-title">The art of doing less</h3><div class="article-meta">6 min read · Saved yesterday</div></div>
 </a>
</section>
<p class="search-hint">Search or enter an address in the Browse X toolbar above.</p>
</main>
<script>
(()=> {
 const $=id=>document.getElementById(id);
 $('settings').addEventListener('click',()=>alert('Open the Browse X menu above to access browser settings.'));
 $('edit').addEventListener('click',()=>{
   const current=[...document.querySelectorAll('.shortcut span:last-child')].map(x=>x.textContent).join(', ');
   const value=prompt('Edit your four favorite labels (separate with commas):',current);
   if(!value)return;
   const names=value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,4);
   const links=[...document.querySelectorAll('.shortcut')];
   names.forEach((name,i)=>{if(links[i]){links[i].querySelector('span:last-child').textContent=name;links[i].querySelector('.shortcut-icon').textContent=name.charAt(0).toUpperCase();}});
 });
 $('view-all').addEventListener('click',()=>location.href='https://fieldnotes.design');
 const hour=new Date().getHours();
 $('greeting').textContent=hour<12?'Good morning. Where to next?':hour<18?'Good afternoon. Where to next?':'Good evening. Where to next?';
})();
</script>
</body>
</html>
