name: BrowseX CI

on:
  push:
    branches: [ main, rewrite-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests, lint and build APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Verify APK outputs and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 3
          printf '%s\n' "${APKS[@]}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            BADGING="$("$AAPT" dump badging "$apk")"
            grep -F "package: name='com.browsex.app'" <<< "$BADGING"
            grep -F "sdkVersion:'26'" <<< "$BADGING"
            unzip -l "$apk" | grep -q 'lib/.*libxul.so'
          done
          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep 'universal' | head -n 1)"
          test -n "$UNIVERSAL"
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/libxul.so'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/libxul.so'
          printf '%s\n' "${APKS[@]}" | xargs sha256sum | tee "$APK_DIR/SHA256SUMS.txt"

      - name: Upload verified debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: browsex-debug-apks
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14
