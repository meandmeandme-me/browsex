name: Wren CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wren-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure stable debug signing (optional)
        shell: bash
        env:
          WREN_DEBUG_KEYSTORE_BASE64: ${{ secrets.WREN_DEBUG_KEYSTORE_BASE64 }}
          WREN_DEBUG_STORE_PASSWORD: ${{ secrets.WREN_DEBUG_STORE_PASSWORD }}
          WREN_DEBUG_KEY_ALIAS: ${{ secrets.WREN_DEBUG_KEY_ALIAS }}
          WREN_DEBUG_KEY_PASSWORD: ${{ secrets.WREN_DEBUG_KEY_PASSWORD }}
        run: |
          if [[ -z "$WREN_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::notice::No stable debug keystore configured; this run will use the runner's temporary debug certificate."
            exit 0
          fi
          printf '%s' "$WREN_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wren-debug.keystore"
          {
            echo "WREN_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/wren-debug.keystore"
            echo "WREN_DEBUG_STORE_PASSWORD=$WREN_DEBUG_STORE_PASSWORD"
            echo "WREN_DEBUG_KEY_ALIAS=$WREN_DEBUG_KEY_ALIAS"
            echo "WREN_DEBUG_KEY_PASSWORD=$WREN_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure release signing (optional)
        shell: bash
        env:
          WREN_RELEASE_KEYSTORE_BASE64: ${{ secrets.WREN_RELEASE_KEYSTORE_BASE64 }}
          WREN_RELEASE_STORE_PASSWORD: ${{ secrets.WREN_RELEASE_STORE_PASSWORD }}
          WREN_RELEASE_KEY_ALIAS: ${{ secrets.WREN_RELEASE_KEY_ALIAS }}
          WREN_RELEASE_KEY_PASSWORD: ${{ secrets.WREN_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$WREN_RELEASE_KEYSTORE_BASE64" && -z "$WREN_RELEASE_STORE_PASSWORD" && -z "$WREN_RELEASE_KEY_ALIAS" && -z "$WREN_RELEASE_KEY_PASSWORD" ]]; then
            echo "WREN_RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::notice::Release signing is not configured; signed release artifacts will be skipped."
            exit 0
          fi
          if [[ -z "$WREN_RELEASE_KEYSTORE_BASE64" || -z "$WREN_RELEASE_STORE_PASSWORD" || -z "$WREN_RELEASE_KEY_ALIAS" || -z "$WREN_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure all four WREN_RELEASE_* secrets or leave all of them empty."
            exit 1
          fi
          printf '%s' "$WREN_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wren-release.keystore"
          {
            echo "WREN_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/wren-release.keystore"
            echo "WREN_RELEASE_STORE_PASSWORD=$WREN_RELEASE_STORE_PASSWORD"
            echo "WREN_RELEASE_KEY_ALIAS=$WREN_RELEASE_KEY_ALIAS"
            echo "WREN_RELEASE_KEY_PASSWORD=$WREN_RELEASE_KEY_PASSWORD"
            echo "WREN_RELEASE_SIGNING_CONFIGURED=true"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Android locale resources
        run: python3 scripts/check_locales.py

      - name: Validate Wren database safety policy
        run: python3 scripts/check_database_policy.py

      - name: Validate Wren brand identity
        run: python3 scripts/check_brand_identity.py

      - name: Run tests, lint and build APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Run Room migration instrumentation tests
        if: ${{ hashFiles('app/src/androidTest/**/*Migration*Test.kt') != '' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Build release APKs (production-signed when configured)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 3
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
            grep -F "package: name='com.wren.app'" <<< "$BADGING"
            grep -F "sdkVersion:'26'" <<< "$BADGING"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/release-apk-files.txt"
            grep -q 'lib/.*libxul.so' "$RUNNER_TEMP/release-apk-files.txt"
          done
          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep 'universal' | head -n 1)"
          test -n "$UNIVERSAL"
          unzip -Z1 "$UNIVERSAL" > "$RUNNER_TEMP/release-universal-files.txt"
          grep -q 'lib/armeabi-v7a/libxul.so' "$RUNNER_TEMP/release-universal-files.txt"
          grep -q 'lib/arm64-v8a/libxul.so' "$RUNNER_TEMP/release-universal-files.txt"
          printf '%s\n' "${APKS[@]}" | xargs sha256sum | tee "$APK_DIR/SHA256SUMS.txt"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: wren-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wren-room-schema
          path: |
            app/schemas/*.json
            app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify generated Room schema snapshot is committed
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_SOURCE="app/src/main/java/com/wren/app/storage/WrenDatabase.kt"
          ROOM_VERSION="$(python3 -c 'import re; from pathlib import Path; s=Path("'"$DATABASE_SOURCE"'").read_text(); m=re.search(r"version\s*=\s*(\d+)", s); print(m.group(1) if m else "")')"
          test -n "$ROOM_VERSION"
          SCHEMA="app/schemas/com.wren.app.storage.WrenDatabase/$ROOM_VERSION.json"
          test -s "$SCHEMA"
          if ! git diff --quiet -- "$SCHEMA"; then
            echo "::error::Room schema changed. Commit the generated schema JSON and its migration with this change."
            git diff -- "$SCHEMA"
            exit 1
          fi

      - name: Verify APK outputs and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 3
          printf '%s\n' "${APKS[@]}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            BADGING="$("$AAPT" dump badging "$apk")"
            grep -F "package: name='com.wren.app'" <<< "$BADGING"
            grep -F "sdkVersion:'26'" <<< "$BADGING"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
            grep -q 'lib/.*libxul.so' "$RUNNER_TEMP/apk-files.txt"
          done
          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep 'universal' | head -n 1)"
          test -n "$UNIVERSAL"
          unzip -Z1 "$UNIVERSAL" > "$RUNNER_TEMP/universal-files.txt"
          grep -q 'lib/armeabi-v7a/libxul.so' "$RUNNER_TEMP/universal-files.txt"
          grep -q 'lib/arm64-v8a/libxul.so' "$RUNNER_TEMP/universal-files.txt"
          printf '%s\n' "${APKS[@]}" | xargs sha256sum | tee "$APK_DIR/SHA256SUMS.txt"

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wren-arm64-v8a-debug
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM32 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wren-armeabi-v7a-debug
          path: |
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wren-universal-debug
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
