name: BrowseX CI

on:
  push:
    branches: [ main, rewrite-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure stable debug signing (optional)
        shell: bash
        env:
          BROWSEX_DEBUG_KEYSTORE_BASE64: ${{ secrets.BROWSEX_DEBUG_KEYSTORE_BASE64 }}
          BROWSEX_DEBUG_STORE_PASSWORD: ${{ secrets.BROWSEX_DEBUG_STORE_PASSWORD }}
          BROWSEX_DEBUG_KEY_ALIAS: ${{ secrets.BROWSEX_DEBUG_KEY_ALIAS }}
          BROWSEX_DEBUG_KEY_PASSWORD: ${{ secrets.BROWSEX_DEBUG_KEY_PASSWORD }}
        run: |
          if [[ -z "$BROWSEX_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::notice::No stable debug keystore configured; this run will use the runner's temporary debug certificate."
            exit 0
          fi
          printf '%s' "$BROWSEX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/browsex-debug.keystore"
          {
            echo "BROWSEX_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/browsex-debug.keystore"
            echo "BROWSEX_DEBUG_STORE_PASSWORD=$BROWSEX_DEBUG_STORE_PASSWORD"
            echo "BROWSEX_DEBUG_KEY_ALIAS=$BROWSEX_DEBUG_KEY_ALIAS"
            echo "BROWSEX_DEBUG_KEY_PASSWORD=$BROWSEX_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure release signing (optional)
        shell: bash
        env:
          BROWSEX_RELEASE_KEYSTORE_BASE64: ${{ secrets.BROWSEX_RELEASE_KEYSTORE_BASE64 }}
          BROWSEX_RELEASE_STORE_PASSWORD: ${{ secrets.BROWSEX_RELEASE_STORE_PASSWORD }}
          BROWSEX_RELEASE_KEY_ALIAS: ${{ secrets.BROWSEX_RELEASE_KEY_ALIAS }}
          BROWSEX_RELEASE_KEY_PASSWORD: ${{ secrets.BROWSEX_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$BROWSEX_RELEASE_KEYSTORE_BASE64" && -z "$BROWSEX_RELEASE_STORE_PASSWORD" && -z "$BROWSEX_RELEASE_KEY_ALIAS" && -z "$BROWSEX_RELEASE_KEY_PASSWORD" ]]; then
            echo "BROWSEX_RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::notice::Release signing is not configured; signed release artifacts will be skipped."
            exit 0
          fi
          if [[ -z "$BROWSEX_RELEASE_KEYSTORE_BASE64" || -z "$BROWSEX_RELEASE_STORE_PASSWORD" || -z "$BROWSEX_RELEASE_KEY_ALIAS" || -z "$BROWSEX_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure all four BROWSEX_RELEASE_* secrets or leave all of them empty."
            exit 1
          fi
          printf '%s' "$BROWSEX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/browsex-release.keystore"
          {
            echo "BROWSEX_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/browsex-release.keystore"
            echo "BROWSEX_RELEASE_STORE_PASSWORD=$BROWSEX_RELEASE_STORE_PASSWORD"
            echo "BROWSEX_RELEASE_KEY_ALIAS=$BROWSEX_RELEASE_KEY_ALIAS"
            echo "BROWSEX_RELEASE_KEY_PASSWORD=$BROWSEX_RELEASE_KEY_PASSWORD"
            echo "BROWSEX_RELEASE_SIGNING_CONFIGURED=true"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Android locale resources
        run: python3 scripts/check_locales.py

      - name: Run tests, lint and build APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Build signed release APKs
        if: ${{ env.BROWSEX_RELEASE_SIGNING_CONFIGURED == 'true' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signed release APKs
        if: ${{ env.BROWSEX_RELEASE_SIGNING_CONFIGURED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 3
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
            grep -F "package: name='com.browsex.app'" <<< "$BADGING"
            grep -F "sdkVersion:'26'" <<< "$BADGING"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/release-apk-files.txt"
            grep -q 'lib/.*libxul.so' "$RUNNER_TEMP/release-apk-files.txt"
          done
          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep 'universal' | head -n 1)"
          test -n "$UNIVERSAL"
          unzip -Z1 "$UNIVERSAL" > "$RUNNER_TEMP/release-universal-files.txt"
          grep -q 'lib/armeabi-v7a/libxul.so' "$RUNNER_TEMP/release-universal-files.txt"
          grep -q 'lib/arm64-v8a/libxul.so' "$RUNNER_TEMP/release-universal-files.txt"
          printf '%s\n' "${APKS[@]}" | xargs sha256sum | tee "$APK_DIR/SHA256SUMS.txt"

      - name: Upload signed release APKs
        if: ${{ env.BROWSEX_RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: browsex-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: browsex-room-schema
          path: app/schemas/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK outputs and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 3
          printf '%s\n' "${APKS[@]}"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for apk in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            BADGING="$("$AAPT" dump badging "$apk")"
            grep -F "package: name='com.browsex.app'" <<< "$BADGING"
            grep -F "sdkVersion:'26'" <<< "$BADGING"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
            grep -q 'lib/.*libxul.so' "$RUNNER_TEMP/apk-files.txt"
          done
          UNIVERSAL="$(printf '%s\n' "${APKS[@]}" | grep 'universal' | head -n 1)"
          test -n "$UNIVERSAL"
          unzip -Z1 "$UNIVERSAL" > "$RUNNER_TEMP/universal-files.txt"
          grep -q 'lib/armeabi-v7a/libxul.so' "$RUNNER_TEMP/universal-files.txt"
          grep -q 'lib/arm64-v8a/libxul.so' "$RUNNER_TEMP/universal-files.txt"
          printf '%s\n' "${APKS[@]}" | xargs sha256sum | tee "$APK_DIR/SHA256SUMS.txt"

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: browsex-arm64-v8a-debug
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM32 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: browsex-armeabi-v7a-debug
          path: |
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: browsex-universal-debug
          path: |
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
