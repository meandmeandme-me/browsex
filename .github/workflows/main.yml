name: Build and publish BrowseX APK

on:
  push:
    branches: [ main, rewrite-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Bundle uBlock Origin (Firefox extension)
        run: |
          mkdir -p app/src/main/assets/ublock
          if curl -fsSL -o ubo.xpi "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"; then
            unzip -q -o ubo.xpi -d app/src/main/assets/ublock
            rm -rf app/src/main/assets/ublock/META-INF
            echo "uBlock Origin bundled"
          else
            echo "Could not download uBlock Origin; building without it"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests, lint and build APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Verify APK outputs and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          find "$APK_DIR" -type f -name '*.apk' -print
          find "$APK_DIR" -type f -name '*.apk' -print -quit | grep -q .
          find "$APK_DIR" -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browsex-latest
          name: BrowseX – Latest build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/*.apk
